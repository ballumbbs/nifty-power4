name: Power-4 alerts

on:
  # Starts (or restarts) the all-day loop. Pushing a change to the bot also starts it.
  schedule:
    - cron: "40 3 * * 1-5"     # 09:10 IST, Mon-Fri (backup restart; GitHub may run it late)
  push:
    branches: [main]
    paths: ["loop.py", "power4.py", ".github/workflows/power4.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "loop = keep checking all session (normal), run = one check, test = Telegram test, demo = replay last day's alerts"
        default: loop
        type: choice
        options: [loop, run, test, demo]

permissions:
  contents: write
  actions: write

concurrency:
  group: power4-${{ github.event.inputs.mode || 'loop' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Power-4
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          P4_EXPIRY_WEEKDAY: ${{ vars.P4_EXPIRY_WEEKDAY || '1' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          P4_START_BALANCE: ${{ vars.P4_START_BALANCE || '7500' }}
        run: |
          git config user.name "power4-bot"
          git config user.email "power4-bot@users.noreply.github.com"
          case "${{ github.event.inputs.mode || 'loop' }}" in
            test) python power4.py test ;;
            demo) python power4.py demo ;;
            run)  python power4.py && python -c "import loop; loop.save_status()" ;;
            *)    python loop.py ;;
          esac
